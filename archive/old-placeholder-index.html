<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aidlin Design</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; color: #2b2622; background: #faf7f3; line-height: 1.6; }
    .page { min-height: 100vh; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; position: sticky; top: 0; background: #faf7f3; z-index: 10; }
    header nav a { margin-inline-start: 1.5rem; color: inherit; text-decoration: none; }

    /* Sections */
    section { padding: 5rem 2rem; max-width: 960px; margin: 0 auto; }
    #hero { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    h2 { font-size: 2rem; margin-bottom: 1rem; }

    /* Footer */
    footer { text-align: center; padding: 2rem; font-size: .9rem; color: #7a6f66; }

    /* Scroll animation (same behavior as the .animate-on-scroll / .visible logic in Index.tsx) */
    .animate-on-scroll { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .animate-on-scroll.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header>
      <strong>Aidlin Design</strong>
      <nav>
        <a href="#about">אודות</a>
        <a href="#contact">צור קשר</a>
      </nav>
    </header>

    <!-- HeroSection -->
    <section id="hero" class="animate-on-scroll">
      <h1>Aidlin Design</h1>
      <p>עיצוב אלגוריתמי והדפסת תלת-ממד בחומר קרמי.</p>
    </section>

    <!-- AboutSection -->
    <section id="about" class="animate-on-scroll">
      <h2>אודות</h2>
      <p>כאן יבוא הטקסט של אזור "אודות".</p>
    </section>

    <!-- ContactSection -->
    <section id="contact" class="animate-on-scroll">
      <h2>צור קשר</h2>
      <p>כאן יבואו פרטי יצירת הקשר.</p>
    </section>

    <!-- Footer -->
    <footer>© Aidlin Design</footer>

  </div>

  <script>
    // Initialize intersection observer for animation on scroll
    document.addEventListener("DOMContentLoaded", function () {
      var observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
            }
          });
        },
        { threshold: 0.1 }
      );

      // Observe all elements with animate-on-scroll class
      document.querySelectorAll(".animate-on-scroll").forEach(function (el) {
        observer.observe(el);
      });
    });
  </script>
</body>
</html>
